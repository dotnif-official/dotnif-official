name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at 00:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "generate_terminal.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install github-readme-terminal requests python-dotenv Pillow

      - name: Run script to generate GIF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_USERNAME: ${{ github.repository_owner }}
        run: |
          python generate_terminal.py

      - name: Download GitHub Stats SVGs
        run: |
          OWNER="${{ github.repository_owner }}"
          [ -z "$OWNER" ] && OWNER="dotnif-official"
          curl -s -L "https://streak-stats.demolab.com/?user=${OWNER}&theme=dark&background=080E1A&border=42D9FF&stroke=1D63F5&ring=42D9FF&fire=42D9FF&currStreakNum=F5F7FF&currStreakLabel=42D9FF&sideNums=AEBBD0&sideLabels=42D9FF&dates=AEBBD0" -o github-streak.svg || true
          curl -s -L "https://github-readme-stats-anuraghazra1.vercel.app/api?username=${OWNER}&show_icons=true&hide_rank=false&bg_color=080E1A&title_color=42D9FF&text_color=AEBBD0&icon_color=42D9FF&border_color=1D63F5" -o github-stats.svg || true
          curl -s -L "https://github-readme-stats-anuraghazra1.vercel.app/api/top-langs/?username=${OWNER}&layout=compact&bg_color=080E1A&title_color=42D9FF&text_color=AEBBD0&border_color=1D63F5" -o github-top-langs.svg || true

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add terminal.gif github-stats.svg github-streak.svg github-top-langs.svg
          if git commit -m "chore: update profile terminal and stats assets"; then
            git push
          fi
