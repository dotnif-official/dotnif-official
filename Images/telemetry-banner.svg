<svg xmlns="http://www.w3.org/2000/svg" width="700" height="120" viewBox="0 0 700 120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#42D9FF" />
      <stop offset="50%" stop-color="#4364FF" />
      <stop offset="100%" stop-color="#42D9FF" />
    </linearGradient>
  </defs>
  
  <rect width="700" height="120" rx="12" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  
  <!-- Status dot and header -->
  <circle cx="28" cy="24" r="5" fill="#10B981" />
  <circle cx="28" cy="24" r="9" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />
  <text x="44" y="28" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#42D9FF" letter-spacing="1">LIVE TELEMETRY // PRODUCTION BENCHMARKS</text>
  <text x="672" y="28" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="11" fill="#AEBBD0">SLA: 100% CODE OWNERSHIP</text>
  
  <line x1="20" y1="42" x2="680" y2="42" stroke="#1E293B" stroke-width="1" />
  
  <!-- Metric 1: LCP -->
  <g transform="translate(40, 60)">
    <text x="0" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#F5F7FF">380ms</text>
    <text x="0" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#42D9FF">⚡ SUB-SECOND LCP</text>
  </g>
  
  <!-- Metric 2: CLS -->
  <g transform="translate(210, 60)">
    <text x="0" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#F5F7FF">0.000</text>
    <text x="0" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">🎯 ZERO CLS SHIFT</text>
  </g>
  
  <!-- Metric 3: INP -->
  <g transform="translate(380, 60)">
    <text x="0" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#F5F7FF">24ms</text>
    <text x="0" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#818CF8">⚡ INSTANT INP</text>
  </g>
  
  <!-- Metric 4: Score -->
  <g transform="translate(540, 60)">
    <text x="0" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#F5F7FF">100 / 100</text>
    <text x="0" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#10B981">✓ LIGHTHOUSE</text>
  </g>
</svg>